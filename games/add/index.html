<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>add · zelo/zuno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;overflow-x:hidden}
body{background:#000;color:#f5f5f7;-webkit-font-smoothing:antialiased;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Helvetica Neue',Arial,sans-serif;min-height:100dvh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;padding:calc(env(safe-area-inset-top) + 1.25rem) 18px 10px;max-width:1040px;width:100%;margin:0 auto}
.logo{grid-column:2;font-weight:600;font-size:clamp(1.5rem,5vw,2.25rem);line-height:1.1;letter-spacing:-.04em;text-align:center}
.top .chip{grid-column:3;justify-self:end;align-self:center;min-width:0;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@media(max-width:360px){.top .chip{padding:6px 9px;font-size:.72rem}}
.chip{background:#111113;border:1px solid #1d1d1f;color:#f5f5f7;border-radius:999px;padding:7px 14px;font-size:.8rem;display:flex;align-items:center;gap:7px;transition:border-color .2s}
.chip:hover{border-color:#3a3a3c}
main{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:0 18px 18px;display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){main{grid-template-columns:1.6fr 1fr;align-items:start;padding-top:24px}}
.play{background:#111113;border:1px solid #1d1d1f;border-radius:20px;padding:22px 20px 20px;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden;min-height:min(520px,calc(100dvh - 90px))}
.bar{position:absolute;left:0;top:0;height:3px;width:100%;background:#1d1d1f}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#0a84ff,#5e5ce6);transform-origin:left;transition:background .3s}
.pts{font-size:.8rem;color:#86868b;letter-spacing:.08em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.pts b{color:#f5f5f7;font-weight:600}
.q{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%;gap:22px}
.eq{font-size:clamp(3.2rem,15vw,6rem);font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1;transition:opacity .3s,transform .3s;white-space:nowrap}
.eq span{color:#6e6e73;font-weight:400;margin:0 .15em}
.ans{display:flex;gap:10px;width:100%;max-width:320px}
.ans input{flex:1;min-width:0;background:#000;border:1px solid #2c2c2e;border-radius:14px;color:#f5f5f7;font-size:1.8rem;font-weight:600;text-align:center;padding:12px;font-family:inherit;outline:none;transition:border-color .2s}
.ans input:focus{border-color:#0a84ff}
.btn{background:#f5f5f7;color:#000;border:0;border-radius:14px;padding:0 20px;font-size:1rem;font-weight:600;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.96)}
.res{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#111113;opacity:0;pointer-events:none;transition:opacity .35s}
.res.show{opacity:1;pointer-events:auto}
.big{font-size:clamp(4.5rem,22vw,8rem);font-weight:700;letter-spacing:-.05em;font-variant-numeric:tabular-nums;line-height:1;background:linear-gradient(180deg,#fff,#8e8e93);-webkit-background-clip:text;background-clip:text;color:transparent}
.res.show .big{animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.res .sub{color:#86868b;font-size:.95rem;text-align:center}
.res .sub.bad{color:#ff6961}
.res .btn{padding:13px 34px;margin-top:14px}
.note{font-size:.75rem;color:#6e6e73;margin-top:12px;text-align:center}
.note a{color:#a1a1a6;text-decoration:underline;cursor:pointer}
.side{display:grid;gap:16px}
@media(max-width:899px){.side{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.side{grid-template-columns:1fr}}
.panel{background:#111113;border:1px solid #1d1d1f;border-radius:20px;padding:16px 18px}
.panel h3{font-size:.75rem;color:#86868b;font-weight:500;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between}
.panel h3 b{color:#f5f5f7;font-weight:600}
.row{display:flex;justify-content:space-between;font-size:.9rem;padding:6px 0;border-top:1px solid #1a1a1c;font-variant-numeric:tabular-nums}
.row:first-of-type{border-top:0}
.row .m{color:#86868b}
.empty{color:#6e6e73;font-size:.85rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.modal.show{opacity:1;pointer-events:auto}
.mbox{background:#111113;border:1px solid #2c2c2e;border-radius:22px;padding:26px 22px;width:100%;max-width:360px}
.mbox h2{font-size:1.3rem;font-weight:600;letter-spacing:-.02em;margin-bottom:6px}
.mbox p{color:#86868b;font-size:.85rem;margin-bottom:16px}
.mbox input{width:100%;background:#000;border:1px solid #2c2c2e;border-radius:12px;color:#f5f5f7;font-size:1.05rem;padding:12px 14px;font-family:inherit;outline:none;margin-bottom:8px}
.mbox input:focus{border-color:#0a84ff}
.err{color:#ff6961;font-size:.8rem;min-height:1.2em;margin-bottom:10px}
.mrow{display:flex;gap:10px;justify-content:flex-end}
.ghost{background:none;border:0;color:#86868b;font-size:.9rem;padding:10px}
.mbox .btn{padding:11px 20px}
@keyframes zin{from{opacity:0}to{opacity:1}}
main,.chip{animation:zin .35s ease both}
main,.chip{transition:opacity .25s ease}
body.entered main,body.entered .chip{animation:none}
body.leaving main{opacity:0}
body.leaving .chip{opacity:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <a class="logo" id="home" href="../../#tiles">zelo/zuno</a>
  <button class="chip" id="chip"><span id="chipT">Sign in</span></button>
</header>
<main>
  <section class="play">
    <div class="bar"><i id="bar"></i></div>
    <div class="pts"><b id="live">100</b> points</div>
    <div class="q">
      <div class="eq" id="eq">0<span>+</span>0</div>
      <form class="ans" id="form" autocomplete="off">
        <input id="in" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="?" aria-label="answer">
        <button class="btn" type="submit">Go</button>
      </form>
    </div>
    <div class="note" id="note">Sign in to save &amp; join leaderboard</div>
    <div class="res" id="res">
      <div class="big" id="big">0</div>
      <div class="sub" id="sub"></div>
      <button class="btn" id="next">Next</button>
    </div>
  </section>
  <aside class="side">
    <div class="panel"><h3>My plays <span>best <b id="best">–</b></span></h3><div id="hist"><div class="empty">Loading…</div></div></div>
    <div class="panel"><h3>Leaderboard</h3><div id="lb"><div class="empty">Loading…</div></div></div>
  </aside>
</main>
<div class="modal" id="modal"><form class="mbox" id="uform">
  <h2>Choose a username</h2>
  <p>Shown on the leaderboard. 3–16 letters or digits.</p>
  <input id="uname" maxlength="16" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="username">
  <div class="err" id="uerr"></div>
  <div class="mrow"><button type="button" class="ghost" id="ulater">Later</button><button class="btn" type="submit">Save</button></div>
</form></div>
<script type="module">
import * as zz from '../../shared/zz.js?v=4';
const G='add',$=id=>document.getElementById(id);
let a,b,t0,raf,busy=false;
const pts=()=>Math.max(0,100-5*Math.floor((performance.now()-t0)/1000));
function tick(){const ms=performance.now()-t0,p=pts();$('live').textContent=p;$('bar').style.transform=`scaleX(${Math.max(0,1-ms/20000)})`;if(p<=0)$('bar').style.background='#3a3a3c';if(p>0)raf=requestAnimationFrame(tick);}
function newQ(){a=1+Math.floor(Math.random()*99);b=1+Math.floor(Math.random()*99);$('eq').innerHTML=`${a}<span>+</span>${b}`;$('in').value='';$('res').classList.remove('show');$('bar').style.background='';busy=false;t0=performance.now();cancelAnimationFrame(raf);tick();$('in').focus({preventScroll:true});}
function countUp(n){const el=$('big'),s=performance.now();(function f(){const k=Math.min(1,(performance.now()-s)/600);el.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})();}
$('form').onsubmit=async e=>{e.preventDefault();const v=$('in').value.trim();if(busy||!/^\d+$/.test(v))return;busy=true;cancelAnimationFrame(raf);
  const timeMs=Math.round(performance.now()-t0),ok=+v===a+b,score=ok?Math.max(0,100-5*Math.floor(timeMs/1000)):0;
  $('in').blur();$('sub').className='sub'+(ok?'':' bad');$('sub').textContent=ok?`${(timeMs/1000).toFixed(1)}s · ${a} + ${b} = ${a+b}`:`Wrong — ${a} + ${b} = ${a+b}`;
  $('res').classList.add('show');countUp(score);setTimeout(()=>$('next').focus({preventScroll:true}),50);
  const uid=curUid;if(!uid)return;
  try{await zz.saveScore(G,score,{timeMs,a,b});}catch(e){console.error(e);}
  if(uid===curUid){loadMine();loadLb();}};
$('next').onclick=newQ;
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('res').classList.contains('show')&&document.activeElement!==$('next')){e.preventDefault();newQ();}});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ---- auth-scoped state: everything below is keyed to curUid + gen token ----
let curUid=null,gen=0;
const empty=t=>`<div class="empty">${t}</div>`;
function clearMine(msg){$('best').textContent='–';$('hist').innerHTML=empty(msg);}
async function loadMine(){const my=++gen,uid=curUid;
  if(!uid){clearMine('Sign in to save your plays');return;}
  let h;try{h=await zz.getMyHistory(G,6);}catch(e){h=undefined;}
  if(my!==gen||uid!==curUid||zz.currentUser()?.uid!==uid)return; // stale
  if(!h||h.uid!==uid){clearMine('Could not load plays');return;}
  $('best').textContent=h.best;
  $('hist').innerHTML=h.recent.length?h.recent.map(p=>`<div class="row"><span>${p.a??'?'} + ${p.b??'?'}</span><span class="m">${p.timeMs!=null?(p.timeMs/1000).toFixed(1)+'s':''}</span><b>${p.score}</b></div>`).join(''):empty('No plays yet');}
async function loadLb(){
  try{const l=await Promise.race([zz.getLeaderboard(G,10),new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),8000))]);$('lb').innerHTML=l.length?l.map((r,i)=>`<div class="row"><span><span class="m">${i+1}</span>&nbsp; ${esc(r.username)}</span><b>${r.best}</b></div>`).join(''):empty('No scores yet');}
  catch(e){$('lb').innerHTML=empty('Leaderboard unavailable');}}
$('chip').onclick=async()=>{const u=zz.currentUser();
  if(!u){try{await zz.signInWithGoogle();}catch(e){console.warn(e);}}
  else if(!zz.currentProfile()?.username)$('modal').classList.add('show');
  else if(confirm('Sign out?'))await zz.signOut();};
$('note').onclick=()=>{if(!zz.currentUser())$('chip').click();};
$('ulater').onclick=()=>$('modal').classList.remove('show');
$('uform').onsubmit=async e=>{e.preventDefault();const n=$('uname').value.trim();
  if(!zz.validUsername(n)){$('uerr').textContent='3–16 letters or digits only';return;}
  $('uerr').textContent='';try{await zz.setUsername(n);$('modal').classList.remove('show');}catch(err){$('uerr').textContent=err.message||'Could not save';}};
let authSeen=false;
zz.onUser((u,p)=>{authSeen=true;const uid=u?.uid||null;
  $('chipT').textContent=u?(p?.username||'Set username'):'Sign in';
  $('note').style.visibility=u?'hidden':'visible';
  if(uid!==curUid){curUid=uid;gen++;$('uname').value='';$('uerr').textContent='';clearMine(uid?'Loading…':'Sign in to save your plays');}
  if(u&&!p?.username)$('modal').classList.add('show');else $('modal').classList.remove('show');
  loadMine();loadLb();});
$('home').addEventListener('click',e=>{if(e.metaKey||e.ctrlKey||e.shiftKey||e.button||matchMedia('(prefers-reduced-motion: reduce)').matches)return;e.preventDefault();document.body.classList.add('leaving');setTimeout(()=>location.href=$('home').href,250);});
addEventListener('pageshow',e=>{if(e.persisted)document.body.classList.remove('leaving');});
setTimeout(()=>document.body.classList.add('entered'),1000);
$('best').textContent='–';$('hist').innerHTML=empty('Loading…');newQ();zz.init();
setTimeout(()=>{if(!authSeen){clearMine('Sign in to save your plays');loadLb();}},4000);
</script>
</body>
</html>
