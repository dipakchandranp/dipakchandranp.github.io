<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>zelo/zuno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+Malayalam:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{height:100vh;height:100dvh;background:#000;color:#f5f5f7;-webkit-font-smoothing:antialiased;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Helvetica Neue',Arial,sans-serif;position:relative}
.hero{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;transition:top .8s cubic-bezier(.65,0,.35,1),transform .8s cubic-bezier(.65,0,.35,1);width:100%;padding:0 1.5rem}
h1{font-weight:600;font-size:clamp(2.75rem,11vw,7rem);line-height:1.1;letter-spacing:-.04em;transition:font-size .8s cubic-bezier(.65,0,.35,1)}
.go{display:inline-block;margin-top:1rem;font-size:.85rem;color:#86868b;background:none;border:0;cursor:pointer;font-family:inherit;letter-spacing:.02em;transition:opacity .4s,color .2s}
.go:hover{color:#f5f5f7}
body.open .hero{top:calc(env(safe-area-inset-top) + 1.25rem);transform:translate(-50%,0)}
body.open h1{font-size:clamp(1.5rem,5vw,2.25rem)}
body.open .go{opacity:0;pointer-events:none}
.grid{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 5rem);bottom:1.25rem;margin:0 auto;max-width:960px;padding:0 1.25rem;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(0,170px);gap:1rem;align-content:center;pointer-events:none}
.card{background:#111113;border:1px solid #1d1d1f;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;opacity:0;transform:translateY(16px) scale(.97);transition:opacity .5s,transform .5s,border-color .2s,background .2s;cursor:pointer;min-height:0}
a.card{color:inherit;text-decoration:none}
.card:hover{border-color:#3a3a3c;background:#161618}
.card .ic{font-family:'Noto Sans Malayalam',sans-serif;font-size:clamp(1.8rem,5vw,2.6rem);line-height:1}
.card .t{font-size:.85rem;color:#a1a1a6}
body.open .grid{pointer-events:auto}
body.open .card{opacity:1;transform:none}
body.open .card.off{opacity:.35;cursor:default;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;background:#0a0a0b;border-color:#161618}
.card.off .t{color:#6e6e73;font-size:.8rem;letter-spacing:.08em}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(0,1fr);gap:.75rem;align-content:stretch}.card{border-radius:16px}}
.card:not(.off):active{transform:scale(.97)}
body.instant .hero,body.instant h1,body.instant .go{transition:none!important}
#who{position:fixed;z-index:5;top:calc(env(safe-area-inset-top) + 16px);left:50%;transform:translateX(-50%);max-width:calc(50vw - 80px);min-width:0;background:#111113;border:1px solid #1d1d1f;border-radius:999px;padding:5px 11px;font-size:.75rem;color:#a1a1a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;pointer-events:none;transition:opacity .4s,left .8s cubic-bezier(.65,0,.35,1),transform .8s cubic-bezier(.65,0,.35,1),top .8s cubic-bezier(.65,0,.35,1)}
#who.on{opacity:1}
body:not(.open) #who{max-width:70vw}
body.open #who{left:1.25rem;transform:none;top:calc(env(safe-area-inset-top) + 1.25rem + 2px)}
@media (min-width:900px){body.open #who{left:max(1.25rem,calc(50vw - 480px + 1.25rem))}}
body.instant #who{transition:opacity .4s}
body.leaving .card{opacity:0!important;transform:scale(.98)!important;transition:opacity .25s ease,transform .25s ease!important;transition-delay:0s!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="who" aria-live="polite"></div>
<div class="hero">
<h1>zelo/zuno</h1>
<button class="go" id="go">click here</button>
</div>
<div class="grid" id="grid">
<a class="card" href="games/add/"><span class="ic">സ</span></a>
<div class="card"><span class="ic">മ</span></div>
<div class="card"><span class="ic">ച</span></div>
<div class="card"><span class="ic">ല</span></div>
<div class="card"><span class="ic">ക</span></div>
<div class="card"><span class="ic">ത</span></div>
<div class="card"><span class="ic">എ</span></div>
<div class="card off" id="ld"><span class="t">loading</span></div>
</div>
<script>
function openTiles(){document.body.classList.add('open');document.querySelectorAll('.card').forEach(function(c,i){c.style.transitionDelay=(0.55+i*0.07)+'s'});setTimeout(function(){document.querySelectorAll('.card').forEach(function(c){c.style.transitionDelay='0s'})},1600)}
document.getElementById('go').onclick=function(){document.body.classList.add('open');document.querySelectorAll('.card').forEach(function(c,i){c.style.transitionDelay=(0.55+i*0.07)+'s'});setTimeout(function(){document.querySelectorAll('.card').forEach(function(c){c.style.transitionDelay='0s'})},1600)};
(function(){var n=0,t;document.getElementById('ld').addEventListener('click',function(){n++;clearTimeout(t);t=setTimeout(function(){n=0},1500);if(n>=6){n=0;location.href=atob('bWUv');}});})();

(function(){
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,cards=document.querySelectorAll('.card');
if(location.hash==='#tiles'||/[?&]open\b/.test(location.search)){
  document.body.classList.add('instant','open');
  history.replaceState(null,'',location.pathname);
  if(!RM)cards.forEach(function(c){c.style.transitionDelay='.1s'});
  requestAnimationFrame(function(){requestAnimationFrame(function(){document.body.classList.remove('instant')})});
  setTimeout(function(){cards.forEach(function(c){c.style.transitionDelay='0s'})},800);
}
window.addEventListener('pageshow',function(e){if(e.persisted){document.body.classList.remove('leaving');document.body.classList.add('open');cards.forEach(function(c){c.style.transitionDelay='0s'})}});
document.querySelectorAll('a.card').forEach(function(a){a.addEventListener('click',function(e){
  if(e.metaKey||e.ctrlKey||e.shiftKey||e.button||RM||!document.body.classList.contains('open'))return;
  e.preventDefault();var href=a.href;document.body.classList.add('leaving');
  setTimeout(function(){location.href=href},260);
})});
})();
</script>
<script type="module">
// signed-in indicator; home keeps working if Firebase fails
const who=document.getElementById('who');
import('./shared/zz.js?v=3').then(zz=>{zz.onUser((u,p)=>{if(u){who.textContent=p&&p.username?p.username:'Signed in';who.classList.add('on')}else{who.classList.remove('on');who.textContent=''}});return zz.init()}).catch(e=>console.warn('zz unavailable',e));
</script>
</body>
</html>
