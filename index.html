<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>zelo/zuno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+Malayalam:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{height:100vh;height:100dvh;background:#000;color:#f5f5f7;-webkit-font-smoothing:antialiased;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Helvetica Neue',Arial,sans-serif;position:relative}
.hero{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;transition:top .8s cubic-bezier(.65,0,.35,1),transform .8s cubic-bezier(.65,0,.35,1);width:100%;padding:0 1.5rem}
h1{font-weight:600;font-size:clamp(2.75rem,11vw,7rem);line-height:1.1;letter-spacing:-.04em;transition:font-size .8s cubic-bezier(.65,0,.35,1)}
.go{display:inline-block;margin-top:1rem;font-size:.85rem;color:#86868b;background:none;border:0;cursor:pointer;font-family:inherit;letter-spacing:.02em;transition:opacity .4s,color .2s}
.go:hover{color:#f5f5f7}
body.open .hero{top:calc(env(safe-area-inset-top) + 1.25rem);transform:translate(-50%,0)}
body.open h1{font-size:clamp(1.5rem,5vw,2.25rem)}
body.open .go{opacity:0;pointer-events:none}
.grid{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 5rem);bottom:1.25rem;margin:0 auto;max-width:960px;padding:0 1.25rem;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(0,170px);gap:1rem;align-content:center;pointer-events:none}
.card{background:#111113;border:1px solid #1d1d1f;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;opacity:0;transform:translateY(16px) scale(.97);transition:opacity .5s,transform .5s,border-color .2s,background .2s;cursor:pointer;min-height:0}
.card:hover{border-color:#3a3a3c;background:#161618}
.card .ic{font-family:'Noto Sans Malayalam',sans-serif;font-size:clamp(1.8rem,5vw,2.6rem);line-height:1}
.card .t{font-size:.85rem;color:#a1a1a6}
body.open .grid{pointer-events:auto}
body.open .card{opacity:1;transform:none}
body.open .card.off{opacity:.35;cursor:default;pointer-events:none;background:#0a0a0b;border-color:#161618}
.card.off .t{color:#6e6e73;font-size:.8rem;letter-spacing:.08em}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(0,1fr);gap:.75rem;align-content:stretch}.card{border-radius:16px}}
</style>
</head>
<body>
<div class="hero">
<h1>zelo/zuno</h1>
<button class="go" id="go">click here</button>
</div>
<div class="grid" id="grid">
<div class="card"><span class="ic">അ</span></div>
<div class="card"><span class="ic">മ</span></div>
<div class="card"><span class="ic">ച</span></div>
<div class="card"><span class="ic">ല</span></div>
<div class="card"><span class="ic">ക</span></div>
<div class="card"><span class="ic">ത</span></div>
<div class="card"><span class="ic">എ</span></div>
<div class="card off"><span class="t">loading</span></div>
</div>
<script>
document.getElementById('go').onclick=function(){document.body.classList.add('open');document.querySelectorAll('.card').forEach(function(c,i){c.style.transitionDelay=(0.55+i*0.07)+'s'});setTimeout(function(){document.querySelectorAll('.card').forEach(function(c){c.style.transitionDelay='0s'})},1600)};
</script>
</body>
</html>
